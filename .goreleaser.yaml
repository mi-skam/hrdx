# GoReleaser config - builds cross-platform binaries and GitHub Release
# artifacts for hrdx.
#
# Triggered by pushing a tag like `v0.1.0`. The release workflow runs
# `goreleaser release --clean`, which compiles every target, packs
# them into `.tar.gz` archives (`.zip` on Windows), generates a checksum
# file, and uploads everything to a GitHub Release.

version: 2

project_name: hrdx

before:
  hooks:
    - go mod tidy

builds:
  - id: hrdx
    main: ./cmd/hrdx
    binary: hrdx
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: hrdx
    # Human-friendly name: hrdx_0.1.0_darwin_arm64.tar.gz,
    # hrdx_0.1.0_windows_amd64.zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  # Used by `goreleaser release --snapshot`; lets contributors build
  # a local release without pushing a tag.
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "^test:"
  groups:
    - title: features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: fixes
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: other
      order: 999

release:
  github:
    owner: patriceckhart
    name: hrdx
  draft: false
  prerelease: auto
  # Auto-generated release notes include the changelog groups above plus
  # an install snippet so the release page itself is a landing page.
  header: |
    ## hrdx {{ .Tag }}

    one-liner install (macOS/Linux):

    ```bash
    curl -fsSL https://www.hrdx.dev/install.sh | bash
    ```

    one-liner install (Windows):

    ```powershell
    irm https://www.hrdx.dev/install.ps1 | iex
    ```

    or download a binary below and drop it on your `PATH` (macOS/Linux: `chmod +x` first).
